# Agentic Field-Data Inversion Engine — full stack.
#
#   node-ingestion ──HTTP/WS──> python-agent ──HTTP──> sandbox
#         │                          (LLM)              (isolated exec)
#         └──> postgres (persistence)
#
# Networks:
#   backend    - has egress (agent needs the Gemini API); node, agent, postgres
#   sandboxnet - internal (no egress); agent <-> sandbox only
#
# Usage:
#   cp .env.example .env   # set GEMINI_API_KEY (or keep AGENT_MODE=offline)
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afie
      POSTGRES_PASSWORD: afie
      POSTGRES_DB: inversions
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afie -d inversions"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox:
    build: ./python-agent
    command: uvicorn sandbox_service.main:app --host 0.0.0.0 --port 8001
    environment:
      SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-20}
    networks: [sandboxnet]          # internal only — untrusted code cannot reach the internet
    read_only: true                 # immutable root filesystem
    tmpfs:
      - /tmp                         # scratch space for per-job model scripts
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  python-agent:
    build: ./python-agent
    # --ws-ping-timeout 120: some methods run a real ~50-70 iteration
    # Nelder-Mead search that can legitimately take over a minute — longer
    # than uvicorn's default ~20s ping timeout, which would otherwise flag
    # the connection as dead mid-job.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 60 --ws-ping-timeout 120
    environment:
      AGENT_MODE: ${AGENT_MODE:-auto}
      INTERPRETER_MODE: ${INTERPRETER_MODE:-auto}
      CLASSIFIER_MODE: ${CLASSIFIER_MODE:-offline}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      SANDBOX_URL: http://sandbox:8001
      L2_TOLERANCE: ${L2_TOLERANCE:-0.05}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-6}
      OFFLINE_MAX_ITERATIONS: ${OFFLINE_MAX_ITERATIONS:-200}
      SANDBOX_TIMEOUT_S: ${SANDBOX_TIMEOUT_S:-20}
    networks: [backend, sandboxnet]
    ports:
      - "8000:8000"
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  node-ingestion:
    build: ./node-ingestion
    environment:
      HTTP_PORT: 3000
      AGENT_WS_URL: ws://python-agent:8000/ws/inversion-stream
      DATABASE_URL: postgres://afie:afie@postgres:5432/inversions
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    networks: [backend]
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      python-agent:
        condition: service_started

networks:
  backend:
  sandboxnet:
    internal: true

volumes:
  pgdata:
